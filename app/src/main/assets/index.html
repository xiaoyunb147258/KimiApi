<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kimi API</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="banner">★ QQ群 1107158432 ★ 使用教程与更新发布</div>

<div class="page" id="page-account">
  <div class="page-head">
    <div class="ph-title">账号管理</div>
    <div class="ph-sub">添加 Kimi refresh_token，自动轮询与续期</div>
  </div>
  <button class="btn primary full" id="btn-login" style="margin-bottom:12px">一键登录 Kimi 并自动获取 Token</button>
  <div id="account-list" class="list"></div>
  <div class="empty" id="account-empty">还没有账号，点右下角 + 添加</div>
</div>

<div class="page hidden" id="page-status">
  <div class="page-head">
    <div class="ph-title">网关状态</div>
    <div class="ph-sub">本地 OpenAI 兼容接口</div>
  </div>

  <div class="card status-card">
    <div class="status-line">
      <span class="dot" id="dot"></span>
      <span id="status-text">未运行</span>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="stat-acc">0</div><div class="stat-lab">账号</div></div>
      <div class="stat"><div class="stat-num" id="stat-req">0</div><div class="stat-lab">请求</div></div>
      <div class="stat"><div class="stat-num" id="stat-port">9980</div><div class="stat-lab">端口</div></div>
    </div>
    <div class="addr-box">
      <div class="addr-label">Base URL</div>
      <div class="addr" id="addr">http://127.0.0.1:9980/v1</div>
      <button class="copy-btn" id="btn-copy-url">复制 Base URL</button>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="btn-toggle">启动网关</button>
      <button class="btn ghost" id="btn-restart">重启</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title-row">
      <span class="card-title">请求日志</span>
      <span class="link" id="btn-clear-log">清空</span>
    </div>
    <div class="log" id="log"></div>
  </div>
</div>

<div class="page hidden" id="page-settings">
  <div class="page-head">
    <div class="ph-title">设置</div>
    <div class="ph-sub">端口、鉴权与后台</div>
  </div>

  <div class="card">
    <div class="card-title">网关</div>
    <div class="field">
      <label>端口</label>
      <input type="number" id="in-port" placeholder="9980">
    </div>
    <div class="field">
      <label>API Key</label>
      <input type="text" id="in-key" placeholder="sk-kimi-local">
    </div>
    <div class="field">
      <label>模型名</label>
      <input type="text" id="in-model" placeholder="kimi">
    </div>
    <button class="btn primary full" id="btn-save">保存设置</button>
  </div>

  <div class="card">
    <div class="card-title">开关</div>
    <div class="switch-row">
      <span>开机自启</span>
      <label class="switch"><input type="checkbox" id="sw-auto"><i></i></label>
    </div>
    <div class="switch-row">
      <span>显示悬浮窗</span>
      <label class="switch"><input type="checkbox" id="sw-float"><i></i></label>
    </div>
    <div class="switch-row">
      <span>联网搜索</span>
      <label class="switch"><input type="checkbox" id="sw-search"><i></i></label>
    </div>
  </div>

  <div class="card">
    <div class="card-title">权限</div>
    <button class="btn ghost full" id="btn-overlay">授予悬浮窗权限</button>
    <button class="btn ghost full" id="btn-battery">忽略电池优化</button>
  </div>

  <div class="tip">把 Base URL + API Key 填进任意 OpenAI 客户端即可使用</div>
</div>

<div class="tabbar">
  <div class="tab active" data-page="account">
    <div class="tab-ic">👤</div><div class="tab-tx">账号</div>
  </div>
  <div class="tab" data-page="status">
    <div class="tab-ic">📡</div><div class="tab-tx">状态</div>
  </div>
  <div class="tab" data-page="settings">
    <div class="tab-ic">⚙️</div><div class="tab-tx">设置</div>
  </div>
</div>

<button class="fab" id="btn-add">+</button>

<div class="modal hidden" id="modal">
  <div class="modal-mask"></div>
  <div class="modal-box">
    <div class="modal-title" id="modal-title">添加账号</div>
    <div class="field">
      <label>refresh_token</label>
      <input type="text" id="in-token" placeholder="粘贴 refresh_token">
    </div>
    <div class="field">
      <label>备注（可选）</label>
      <input type="text" id="in-remark" placeholder="例如：小号1">
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="modal-cancel">取消</button>
      <button class="btn primary" id="modal-ok">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script src="settings.js"></script>
</body>
</html>
